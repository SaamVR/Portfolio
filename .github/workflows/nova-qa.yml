name: NOVA Visual QA

on:
  push:
    branches: [main, "nova/v2-integration", "nova/v3", "nova/v3-*"]
    paths:
      - ".github/workflows/nova-qa.yml"
      - "nova/qa-trigger.txt"
      - "nova/site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        phase: [core, extended]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NOVA_QA_PHASE: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact GLTF assets
        uses: actions/cache@v4
        with:
          path: nova/site/assets
          key: nova-gltf-assets-v1-b7ab75e30bb2b8a665b95e6b2105172892d7ec0c02c7e395fd8ce427add92ecc
          fail-on-cache-miss: true

      - name: Vendor Three.js GLTF runtime
        run: |
          set -euo pipefail
          mkdir -p nova/site/vendor/addons/loaders nova/site/vendor/addons/utils
          mkdir -p /tmp/nova-vendor && cd /tmp/nova-vendor
          npm init -y >/dev/null 2>&1
          npm install three@0.180.0 --no-audit --no-fund
          cp node_modules/three/build/three.module.js "$GITHUB_WORKSPACE/nova/site/vendor/"
          cp node_modules/three/build/three.core.js "$GITHUB_WORKSPACE/nova/site/vendor/"
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/loaders/"
          cp node_modules/three/examples/jsm/utils/BufferGeometryUtils.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/utils/"

      - name: Install browser QA
        run: |
          npm install playwright@1.57.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Create V2 QA script
        run: |
          cat > nova/qa-v2.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('nova-qa',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const errors=[];

          const progressPoints=[.02,.06,.10,.119,.121,.16,.18,.20,.22,.26,.279,.281,.36,.449,.451,.57,.579,.581,.65,.719,.721,.76,.79,.83,.859,.861,.92,.945,.959,.961,.985];

          async function readyPage(context,label){
            const page=await context.newPage();
            const local=[];
            page.on('pageerror',e=>{const v=label+': pageerror: '+e.message;errors.push(v);local.push(v);});
            page.on('console',m=>{if(m.type()==='error'){const v=label+': console: '+m.text();errors.push(v);local.push(v);}});
            page.on('requestfailed',r=>{const v=label+': requestfailed: '+r.url()+' :: '+(r.failure()?.errorText||'');errors.push(v);local.push(v);});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.dataset.modelState!=='loading',null,{timeout:20000});
            const model=await page.evaluate(()=>document.body.dataset.modelState);
            if(model!=='ready') throw new Error(label+' expected model ready, got '+model);
            return {page,local};
          }

          async function scrollProgress(page,p){
            await page.evaluate(progress=>{
              document.documentElement.style.scrollBehavior='auto';
              const cinematicMax=()=>{
                const behind=document.querySelector('#behind');
                return Math.max(1,behind.offsetTop+behind.offsetHeight-innerHeight);
              };
              scrollTo(0,Math.max(0,cinematicMax()*progress));
            },p);
            await page.waitForFunction(target=>{
              const behind=document.querySelector('#behind');
              const cinematicMax=Math.max(1,behind.offsetTop+behind.offsetHeight-innerHeight);
              return Math.abs(scrollY/cinematicMax-target)<0.003;
            },p,{timeout:3000});
            await page.waitForTimeout(420);
          }

          async function captureJourney(viewport,prefix){
            const context=await browser.newContext({viewport});
            const {page}=await readyPage(context,prefix);
            const captures=[];
            for(const p of progressPoints){
              await scrollProgress(page,p);
              const state=await page.evaluate(()=>{
                const range=document.body.dataset.range;
                const anchor=document.querySelector('[data-range-anchor="'+range+'"]');
                const content=anchor?.querySelector('.stage-inner,.behind-grid,.behind-transition');
                const rect=content?.getBoundingClientRect();
                const style=content?getComputedStyle(content):null;
                return {
                  range,
                  rangeProgress:document.body.dataset.rangeProgress,
                  model:document.body.dataset.modelState,
                  settled:document.body.dataset.settled,
                  viewport:{width:innerWidth,height:innerHeight},
                  progress:(()=>{
                    const behind=document.querySelector('#behind');
                    const cinematicMax=Math.max(1,behind.offsetTop+behind.offsetHeight-innerHeight);
                    return scrollY/cinematicMax;
                  })(),
                  activeContentVisible:Boolean(rect && rect.bottom>0 && rect.top<innerHeight && Number(style.opacity)>.5),
                  activeContentRect:rect?{top:rect.top,bottom:rect.bottom,height:rect.height}:null,
                  activeContentOpacity:style?Number(style.opacity):null,
                  activeStageRect:anchor?(()=>{const r=anchor.getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:r.height,offsetTop:anchor.offsetTop};})():null,
                  scrollMetrics:(()=>{
                    const behind=document.querySelector('#behind');
                    const cinematicMax=Math.max(1,behind.offsetTop+behind.offsetHeight-innerHeight);
                    return {scrollY,scrollHeight:document.documentElement.scrollHeight,cinematicMax};
                  })()
                };
              });
              if(state.model!=='ready') throw new Error(prefix+' model not ready at '+p);
              if(Math.abs(state.progress-p)>.004) throw new Error(prefix+' scroll drift at '+p+' '+JSON.stringify(state));
              if(!state.activeContentVisible) throw new Error(prefix+' active stage content missing at '+p+' '+JSON.stringify(state));
              const file=prefix+'_p'+String(p).replace('.','')+'.png';
              await page.screenshot({path:'nova-qa/'+file});
              captures.push({p,file,state});
            }
            await context.close();
            return captures;
          }

          async function productPresenceAudit(viewport,prefix){
            const context=await browser.newContext({viewport,hasTouch:prefix==='mobile',isMobile:prefix==='mobile'});
            const {page}=await readyPage(context,prefix+'-product-presence');
            const checks=[.02,.16,.36,.54,.65,.79,.92];
            const results=[];
            for(const progress of checks){
              await scrollProgress(page,progress);
              const state=await page.evaluate(async p=>{
                const read=()=>window.__NOVA_QA__?.productFrame?.()||null;
                let previous=read();
                let stableFrames=0;
                let frames=0;
                while(frames<240 && stableFrames<8){
                  await new Promise(resolve=>requestAnimationFrame(resolve));
                  const next=read();
                  if(previous&&next){
                    const ids=['cushion','headband','controls'];
                    const maxDelta=Math.max(...ids.map(id=>{
                      const a=previous.points?.[id], b=next.points?.[id];
                      if(!a||!b||!Number.isFinite(a.x)||!Number.isFinite(a.y)||!Number.isFinite(b.x)||!Number.isFinite(b.y)) return Infinity;
                      return Math.hypot(b.x-a.x,b.y-a.y);
                    }));
                    stableFrames=maxDelta<=.45 ? stableFrames+1 : 0;
                  }else{
                    stableFrames=0;
                  }
                  previous=next;
                  frames++;
                }
                return {
                  progress:p,
                  range:document.body.dataset.range,
                  model:document.body.dataset.modelState,
                  frame:previous,
                  settled:stableFrames>=8,
                  settleFrames:frames
                };
              },progress);
              results.push(state);
              if(state.model!=='ready'||!state.frame||!state.settled){
                throw new Error(prefix+' product frame unavailable/unsettled '+JSON.stringify(state));
              }
              const minSpanX=prefix==='mobile'?50:100;
              const minSpanY=prefix==='mobile'?35:60;
              await page.screenshot({path:'nova-qa/'+prefix+'_product_presence_'+String(progress).replace('.','')+'.png'});
              const intentionalDesignCrop=state.range==='design';
              const landmarksOk=intentionalDesignCrop
                ? state.frame.nearViewport>=3 && state.frame.inViewport>=2 && state.frame.earcupsInViewport>=1
                : state.frame.inViewport>=3 && state.frame.earcupsInViewport>=2;
              if(
                !landmarksOk ||
                state.frame.spanX<minSpanX ||
                state.frame.spanY<minSpanY
              ){
                throw new Error(prefix+' product not recognizably framed '+JSON.stringify({minSpanX,minSpanY,intentionalDesignCrop,state}));
              }
            }
            fs.writeFileSync('nova-qa/'+prefix+'_product_presence.json',JSON.stringify(results,null,2));
            await context.close();
          }

          async function productCopyCollisionAudit(viewport,prefix){
            const context=await browser.newContext({viewport,hasTouch:prefix==='mobile',isMobile:prefix==='mobile'});
            const {page}=await readyPage(context,prefix+'-collision');
            const checks=[
              {p:.02,label:'hero-opening'},
              {p:.10,label:'hero-resolved'},
              {p:.18,label:'design-close'},
              {p:.20,label:'design-peak'},
              {p:.65,label:'form'},
              {p:.79,label:'inspect'},
              {p:.92,label:'resolution'}
            ];
            for(const check of checks){
              await scrollProgress(page,check.p);
              const result=await page.evaluate(async ({label})=>{
                await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
                const stage=document.querySelector('.stage.is-active');
                const headline=stage?.querySelector('h1,h2');
                const canvas=document.querySelector('#webgl');
                if(!headline||!canvas) return {skipped:true,label};
                const rect=headline.getBoundingClientRect();
                const x0=Math.max(0,Math.floor(rect.left));
                const y0=Math.max(0,Math.floor(rect.top));
                const x1=Math.min(innerWidth,Math.ceil(rect.right));
                const y1=Math.min(innerHeight,Math.ceil(rect.bottom));
                if(x1<=x0||y1<=y0) return {skipped:true,label,rect:{x0,y0,x1,y1}};
                const probe=document.createElement('canvas');
                probe.width=innerWidth;
                probe.height=innerHeight;
                const ctx=probe.getContext('2d',{willReadFrequently:true});
                ctx.clearRect(0,0,probe.width,probe.height);
                ctx.drawImage(canvas,0,0,innerWidth,innerHeight);
                const image=ctx.getImageData(x0,y0,x1-x0,y1-y0);
                let occupied=0;
                let sampled=0;
                const stride=4;
                for(let y=0;y<image.height;y+=stride){
                  for(let x=0;x<image.width;x+=stride){
                    const alpha=image.data[(y*image.width+x)*4+3];
                    sampled++;
                    if(alpha>96) occupied++;
                  }
                }
                return {
                  skipped:false,
                  label,
                  ratio:sampled?occupied/sampled:0,
                  rect:{left:rect.left,top:rect.top,right:rect.right,bottom:rect.bottom}
                };
              },{label:check.label});
              await page.screenshot({path:'nova-qa/'+prefix+'_collision_'+check.label+'.png'});
              if(!result.skipped && result.ratio>.04 && check.label==='resolution'){
                await page.waitForTimeout(1000);
                const settled=await page.evaluate(async ({label})=>{
                  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
                  const stage=document.querySelector('.stage.is-active');
                  const headline=stage?.querySelector('h1,h2');
                  const canvas=document.querySelector('#webgl');
                  if(!headline||!canvas) return {skipped:true,label};
                  const rect=headline.getBoundingClientRect();
                  const x0=Math.max(0,Math.floor(rect.left));
                  const y0=Math.max(0,Math.floor(rect.top));
                  const x1=Math.min(innerWidth,Math.ceil(rect.right));
                  const y1=Math.min(innerHeight,Math.ceil(rect.bottom));
                  const probe=document.createElement('canvas');
                  probe.width=innerWidth;
                  probe.height=innerHeight;
                  const ctx=probe.getContext('2d',{willReadFrequently:true});
                  ctx.drawImage(canvas,0,0,innerWidth,innerHeight);
                  const image=ctx.getImageData(x0,y0,x1-x0,y1-y0);
                  let occupied=0;
                  let sampled=0;
                  const stride=4;
                  for(let y=0;y<image.height;y+=stride){
                    for(let x=0;x<image.width;x+=stride){
                      const alpha=image.data[(y*image.width+x)*4+3];
                      sampled++;
                      if(alpha>96) occupied++;
                    }
                  }
                  return {
                    skipped:false,label,ratio:sampled?occupied/sampled:0,
                    rect:{left:rect.left,top:rect.top,right:rect.right,bottom:rect.bottom}
                  };
                },{label:check.label});
                await page.screenshot({path:'nova-qa/'+prefix+'_collision_'+check.label+'_settled.png'});
                throw new Error(prefix+' resolution convergence diagnostic '+JSON.stringify({initial:result,settled}));
              }
              if(!result.skipped && result.ratio>.04){
                throw new Error(prefix+' headline/product collision at '+check.label+' '+JSON.stringify(result));
              }
            }
            await context.close();
          }

          async function hotspotMotionAudit(viewport,prefix){
            const context=await browser.newContext({viewport,hasTouch:prefix==='mobile',isMobile:prefix==='mobile'});
            const {page}=await readyPage(context,prefix+'-hotspots');

            const pointAt=async (progress,id)=>{
              await scrollProgress(page,progress);
              try{
                await page.waitForFunction(hotspot=>{
                  const el=document.querySelector('[data-hotspot="'+hotspot+'"]');
                  return el?.dataset.visible==='true';
                },id,{timeout:5000});
              }catch(error){
                const diagnostic=await page.evaluate(({progress,id})=>{
                  const el=document.querySelector('[data-hotspot="'+id+'"]');
                  const detailMap={cushion:'cushion',headband:'hinge',controls:'controls'};
                  const detail=document.querySelector('[data-detail-id="'+detailMap[id]+'"]');
                  return {
                    progress,id,
                    range:document.body.dataset.range,
                    rangeProgress:document.body.dataset.rangeProgress,
                    designDetail:document.body.dataset.designDetail,
                    hotspotVisible:el?.dataset.visible||null,
                    hotspotExpanded:el?.getAttribute('aria-expanded')||null,
                    hotspotTransform:el?.style.transform||null,
                    detailPressed:detail?.getAttribute('aria-pressed')||null,
                    scrollY,
                    viewport:{width:innerWidth,height:innerHeight}
                  };
                },{progress,id});
                throw new Error(prefix+' hotspot visibility timeout '+JSON.stringify(diagnostic));
              }
              return page.evaluate(async ({progress,id})=>{
                const el=document.querySelector('[data-hotspot="'+id+'"]');
                const read=()=>{
                  const r=el.getBoundingClientRect();
                  return {x:r.left+r.width/2,y:r.top+r.height/2};
                };
                let previous=read();
                let stableFrames=0;
                let frames=0;
                while(frames<120 && stableFrames<5){
                  await new Promise(resolve=>requestAnimationFrame(resolve));
                  const next=read();
                  const delta=Math.hypot(next.x-previous.x,next.y-previous.y);
                  stableFrames=delta<=.6 ? stableFrames+1 : 0;
                  previous=next;
                  frames++;
                }
                const r=el.getBoundingClientRect();
                return {
                  progress,id,x:r.left+r.width/2,y:r.top+r.height/2,
                  visible:el.dataset.visible,width:innerWidth,height:innerHeight,
                  settled:stableFrames>=5,settleFrames:frames
                };
              },{progress,id});
            };

            const validatePoint=point=>{
              if(!point.settled) throw new Error(prefix+' '+point.id+' hotspot did not settle before bounded-motion sample '+JSON.stringify(point));
              if(point.visible!=='true') throw new Error(prefix+' '+point.id+' hotspot hidden during its Design detail '+JSON.stringify(point));
              const margin=12;
              if(point.x<margin||point.x>point.width-margin||point.y<margin||point.y>point.height-margin){
                throw new Error(prefix+' '+point.id+' hotspot outside viewport '+JSON.stringify(point));
              }
            };

            const checks=[
              {id:'cushion',from:.15,to:.17,expectMotion:true,maxMovement:150},
              {id:'headband',from:.19,to:.22,expectMotion:false,maxMovement:24},
              {id:'controls',from:.245,to:.265,expectMotion:true,maxMovement:90}
            ];
            const samples=[];
            for(const check of checks){
              const first=await pointAt(check.from,check.id);
              const second=await pointAt(check.to,check.id);
              validatePoint(first);
              validatePoint(second);
              const movement=Math.hypot(second.x-first.x,second.y-first.y);
              const margin=16.5;
              const edgeClamped=[first,second].some(point=>
                point.x<=margin||point.x>=point.width-margin||point.y<=margin||point.y>=point.height-margin
              );
              const viewportBound=Math.min(check.maxMovement,Math.max(24,first.width*.38));
              if(movement>viewportBound){
                throw new Error(prefix+' '+check.id+' hotspot motion exceeded bounded Design envelope '+JSON.stringify({movement,viewportBound,first,second}));
              }
              if(check.expectMotion && !edgeClamped && movement<1.5){
                throw new Error(prefix+' '+check.id+' hotspot should track authored Design motion '+JSON.stringify({movement,first,second}));
              }
              samples.push({id:check.id,movement,edgeClamped,expectMotion:check.expectMotion,viewportBound,first,second});
            }

            fs.writeFileSync('nova-qa/'+prefix+'_hotspot_motion.json',JSON.stringify(samples,null,2));
            await page.screenshot({path:'nova-qa/'+prefix+'_hotspots.png'});
            await context.close();
          }

          async function desktopInteractions(){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const {page}=await readyPage(context,'desktop-interactions');

            await scrollProgress(page,.36);
            await page.locator('[data-listening-mode="focus"]').click();
            await page.waitForTimeout(650);
            await page.screenshot({path:'nova-qa/desktop_focus.png'});

            await scrollProgress(page,.52);
            await page.locator('[data-noise-mode="transparency"]').click();
            await page.waitForTimeout(650);
            await page.screenshot({path:'nova-qa/desktop_transparency.png'});

            await scrollProgress(page,.65);
            await page.locator('[data-fold-state="fold"]').click();
            await page.waitForTimeout(850);
            await page.screenshot({path:'nova-qa/desktop_fold.png'});
            await page.mouse.wheel(0,620);
            await page.waitForTimeout(420);
            await page.screenshot({path:'nova-qa/desktop_fold_release.png'});

            await scrollProgress(page,.79);
            const canvas=page.locator('#webgl');
            const box=await canvas.boundingBox();
            if(!box) throw new Error('inspection canvas missing');
            await page.mouse.move(box.x+box.width*.50,box.y+box.height*.50);
            await page.mouse.down();
            await page.mouse.move(box.x+box.width*.72,box.y+box.height*.52,{steps:8});
            await page.mouse.up();
            await page.waitForTimeout(450);
            await page.screenshot({path:'nova-qa/desktop_inspection_drag.png'});
            await page.getByRole('button',{name:/reset view/i}).click();
            await page.waitForTimeout(420);
            await page.screenshot({path:'nova-qa/desktop_inspection_reset.png'});

            await scrollProgress(page,.90);
            await page.getByRole('button',{name:/specifications/i}).click();
            await page.waitForFunction(()=>document.body.dataset.productFacts==='open');
            await page.screenshot({path:'nova-qa/desktop_specifications.png'});
            await page.locator('#productFactsPanel [data-facts-close]').click();
            await page.waitForFunction(()=>document.body.dataset.productFacts==='closed');

            await context.close();
          }

          async function mobileInteractions(){
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true});
            const {page}=await readyPage(context,'mobile-interactions');

            await scrollProgress(page,.18);
            const detailControl=page.locator('[data-detail-id="cushion"]');
            const hotspot=page.locator('[data-hotspot="cushion"]');
            await page.waitForFunction(()=>document.querySelector('[data-hotspot="cushion"]')?.dataset.visible==='true');
            await detailControl.tap();
            await page.waitForFunction(()=>{
              const el=document.querySelector('[data-hotspot="cushion"]');
              const label=el?.querySelector('span');
              return document.querySelector('[data-detail-id="cushion"]')?.getAttribute('aria-pressed')==='true' &&
                el?.getAttribute('aria-expanded')==='true' && label && getComputedStyle(label).display!=='none';
            });
            const expandedLabel=await hotspot.locator('span').evaluate(el=>{
              const rect=el.getBoundingClientRect();
              return {
                display:getComputedStyle(el).display,
                text:el.textContent?.trim()||'',
                labelRect:{left:rect.left,right:rect.right,top:rect.top,bottom:rect.bottom},
                viewport:{width:innerWidth,height:innerHeight}
              };
            });
            if(expandedLabel.display==='none'||!expandedLabel.text) throw new Error('mobile design detail did not expand cushion annotation '+JSON.stringify(expandedLabel));
            if(expandedLabel.labelRect.left<8||expandedLabel.labelRect.right>expandedLabel.viewport.width-8){
              throw new Error('expanded hotspot label outside viewport '+JSON.stringify(expandedLabel));
            }
            await page.screenshot({path:'nova-qa/mobile_hotspot_detail.png'});
            await detailControl.tap();

            await scrollProgress(page,.36);
            await page.locator('[data-listening-mode="ambient"]').tap();
            await page.waitForTimeout(520);
            await page.screenshot({path:'nova-qa/mobile_ambient.png'});

            await scrollProgress(page,.79);
            const box=await page.locator('#webgl').boundingBox();
            if(!box) throw new Error('mobile inspection canvas missing');
            await page.evaluate(({x1,y1,x2,y2})=>{
              const el=document.querySelector('#webgl');
              el.dispatchEvent(new PointerEvent('pointerdown',{pointerId:7,pointerType:'touch',clientX:x1,clientY:y1,bubbles:true}));
              el.dispatchEvent(new PointerEvent('pointermove',{pointerId:7,pointerType:'touch',clientX:x2,clientY:y2,bubbles:true}));
              el.dispatchEvent(new PointerEvent('pointerup',{pointerId:7,pointerType:'touch',clientX:x2,clientY:y2,bubbles:true}));
            },{x1:box.x+box.width*.40,y1:box.y+box.height*.52,x2:box.x+box.width*.68,y2:box.y+box.height*.52});
            await page.waitForTimeout(450);
            await page.screenshot({path:'nova-qa/mobile_inspection_swipe.png'});

            await scrollProgress(page,.90);
            await page.getByRole('button',{name:/specifications/i}).tap();
            await page.waitForFunction(()=>document.body.dataset.productFacts==='open');
            await page.screenshot({path:'nova-qa/mobile_specifications.png'});
            await page.locator('#productFactsPanel [data-facts-close]').tap();
            await page.waitForFunction(()=>document.body.dataset.productFacts==='closed',{timeout:5000});

            await context.close();
          }

          async function caseStudyAudit(viewport,prefix){
            const context=await browser.newContext({viewport,hasTouch:prefix==='mobile',isMobile:prefix==='mobile'});
            const {page}=await readyPage(context,prefix+'-case-study');
            await page.evaluate(()=>{
              const section=document.querySelector('#case-study');
              scrollTo(0,section.offsetTop+24);
            });
            await page.waitForFunction(()=>document.body.dataset.caseStudy==='true');
            await page.waitForFunction(()=>{
              const canvas=document.querySelector('#webgl');
              return canvas && Number(getComputedStyle(canvas).opacity)<=.08;
            },{timeout:1800});
            const result=await page.evaluate(()=>{
              const section=document.querySelector('#case-study');
              const canvas=document.querySelector('#webgl');
              const canvasOpacity=Number(getComputedStyle(canvas).opacity);
              return {
                active:document.body.dataset.caseStudy,
                range:document.body.dataset.range,
                canvasOpacity,
                role:Boolean(section?.innerText.includes('Role')),
                challenge:Boolean(section?.innerText.includes('Challenge')),
                build:Boolean(section?.innerText.includes('What I built')),
                result:Boolean(section?.innerText.includes('Result'))
              };
            });
            if(result.active!=='true'||result.canvasOpacity>.08){
              throw new Error(prefix+' case-study product must yield '+JSON.stringify(result));
            }
            if(result.range!=='behind'||!result.role||!result.challenge||!result.build||!result.result){
              throw new Error(prefix+' case-study handoff incomplete '+JSON.stringify(result));
            }
            await page.screenshot({path:'nova-qa/'+prefix+'_case_study.png',fullPage:false});
            await context.close();
          }

          async function guidedTourAudit(){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const {page}=await readyPage(context,'guided-tour');
            await page.getByRole('button',{name:/three product moments/i}).click();
            await page.waitForFunction(()=>document.body.dataset.guidedTour==='open' && document.body.dataset.range==='design');
            await page.waitForTimeout(850);
            const comfort=await page.evaluate(()=>({
              open:document.body.dataset.guidedTour,
              range:document.body.dataset.range,
              selected:document.querySelector('[data-tour-step="comfort"]')?.getAttribute('aria-pressed'),
              hotspot:document.querySelector('[data-hotspot="cushion"]')?.getAttribute('aria-expanded')
            }));
            if(comfort.open!=='open'||comfort.range!=='design'||comfort.selected!=='true'){
              throw new Error('guided comfort moment failed '+JSON.stringify(comfort));
            }
            await page.screenshot({path:'nova-qa/guided_tour_comfort.png'});

            await page.locator('[data-tour-step="fold"]').click();
            await page.waitForFunction(()=>document.body.dataset.range==='form');
            await page.waitForTimeout(1150);
            const fold=await page.evaluate(()=>({
              selected:document.querySelector('[data-tour-step="fold"]')?.getAttribute('aria-pressed'),
              fold:document.querySelector('[data-fold-state="fold"]')?.getAttribute('aria-pressed'),
              range:document.body.dataset.range
            }));
            if(fold.selected!=='true'||fold.fold!=='true'||fold.range!=='form'){
              throw new Error('guided fold moment failed '+JSON.stringify(fold));
            }
            await page.screenshot({path:'nova-qa/guided_tour_fold.png'});

            await page.locator('[data-tour-step="controls"]').click();
            await page.waitForFunction(()=>document.body.dataset.range==='inspect');
            await page.waitForTimeout(1050);
            const controls=await page.evaluate(()=>({
              selected:document.querySelector('[data-tour-step="controls"]')?.getAttribute('aria-pressed'),
              side:document.querySelector('[data-inspection-view="side"]')?.getAttribute('aria-pressed'),
              hotspot:document.querySelector('[data-hotspot="controls"]')?.getAttribute('aria-expanded'),
              range:document.body.dataset.range
            }));
            if(controls.selected!=='true'||controls.side!=='true'||controls.range!=='inspect'){
              throw new Error('guided controls moment failed '+JSON.stringify(controls));
            }
            await page.screenshot({path:'nova-qa/guided_tour_controls.png'});
            await page.keyboard.press('Escape');
            await page.waitForFunction(()=>document.body.dataset.guidedTour==='closed');
            await context.close();
          }

          async function validationEvidenceAudit(){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const {page}=await readyPage(context,'validation-evidence');
            await page.evaluate(()=>{
              const el=document.querySelector('#validation-evidence');
              const top=el.getBoundingClientRect().top+scrollY;
              scrollTo(0,Math.max(0,top-innerHeight*.22));
            });
            await page.waitForFunction(()=>{
              const el=document.querySelector('#validation-evidence');
              const r=el?.getBoundingClientRect();
              return Boolean(r&&r.top<innerHeight&&r.bottom>0);
            });
            const evidence=await page.evaluate(()=>{
              const el=document.querySelector('#validation-evidence');
              const r=el.getBoundingClientRect();
              const text=el?.innerText||'';
              return {
                visible:r.top<innerHeight&&r.bottom>0,
                desktop:text.includes('1440 × 1000'),
                tablet:text.includes('1024 × 768'),
                mobile:text.includes('390 × 844'),
                fallback:text.includes('WebGL fallback'),
                reduced:text.includes('Reduced motion'),
                gltf:text.includes('GLTF failure')
              };
            });
            if(!Object.values(evidence).every(Boolean)) throw new Error('validation evidence incomplete '+JSON.stringify(evidence));
            await page.screenshot({path:'nova-qa/validation_evidence.png'});
            await context.close();
          }

          async function compactCaseStudyAudit(){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const {page}=await readyPage(context,'compact-case-study');
            await scrollProgress(page,.985);
            await page.waitForTimeout(500);
            const state=await page.evaluate(()=>{
              const behind=document.querySelector('#behind');
              const caseStudy=document.querySelector('#case-study');
              return {
                range:document.body.dataset.range,
                behindRatio:behind.getBoundingClientRect().height/innerHeight,
                title:behind.innerText.includes('Designed like a launch.')&&behind.innerText.includes('Built like a product.'),
                duplicate:caseStudy.innerText.includes('Designed like a launch.'),
                caseTop:caseStudy.getBoundingClientRect().top
              };
            });
            if(state.range!=='behind'||state.behindRatio>1.16||!state.title||state.duplicate){
              throw new Error('compact case-study handoff failed '+JSON.stringify(state));
            }
            await page.screenshot({path:'nova-qa/compact_case_study.png'});
            await context.close();
          }

          async function motionContinuityAudit(){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const {page}=await readyPage(context,'v3-motion-continuity');
            const samples=[];
            for(const progress of [.16,.18,.20,.22,.24,.26,.279]){
              await scrollProgress(page,progress);
              // The render adapter intentionally damps camera/product transforms. Measure
              // continuity only after that authored state has actually converged; otherwise
              // CI frame cadence can compare two different points on the damping curve.
              await page.waitForTimeout(900);
              const range=await page.evaluate(()=>document.body.dataset.range);
              if(range!=='design') throw new Error('V3 continuity sample left Design range '+JSON.stringify({progress,range}));
              const sample=await page.evaluate(async p=>{
                const ids=['cushion','headband','controls'];
                const read=()=>Object.fromEntries(ids.map(id=>{
                  const el=document.querySelector('[data-hotspot="'+id+'"]');
                  const r=el.getBoundingClientRect();
                  return [id,{x:r.left+r.width/2,y:r.top+r.height/2,visible:el.dataset.visible}];
                }));
                let previous=read();
                let stableFrames=0;
                let frames=0;
                while(frames<180 && stableFrames<8){
                  await new Promise(resolve=>requestAnimationFrame(resolve));
                  const next=read();
                  const maxDelta=Math.max(...ids.map(id=>Math.hypot(next[id].x-previous[id].x,next[id].y-previous[id].y)));
                  stableFrames=maxDelta<=.18 ? stableFrames+1 : 0;
                  previous=next;
                  frames++;
                }
                if(stableFrames<8) throw new Error('V3 Design motion did not converge before continuity sample '+JSON.stringify({progress:p,frames}));
                return {
                  progress:p,
                  cushion:previous.cushion,
                  hinge:previous.headband,
                  controls:previous.controls,
                  settleFrames:frames
                };
              },progress);
              samples.push(sample);
            }
            let maxJump=0;
            let visibleComparisons=0;
            const jumps=[];
            for(let i=1;i<samples.length;i++){
              for(const id of ['cushion','hinge','controls']){
                const a=samples[i-1][id], b=samples[i][id];
                const endpointsVisible=a.visible==='true' && b.visible==='true';
                if(!endpointsVisible){
                  jumps.push({from:samples[i-1].progress,to:samples[i].progress,id,skipped:'not-visible'});
                  continue;
                }
                const jump=Math.hypot(b.x-a.x,b.y-a.y);
                visibleComparisons++;
                maxJump=Math.max(maxJump,jump);
                jumps.push({from:samples[i-1].progress,to:samples[i].progress,id,jump});
              }
            }
            if(visibleComparisons<6) throw new Error('V3 Design continuity has insufficient visible anchor samples '+JSON.stringify({visibleComparisons,jumps}));
            fs.writeFileSync('nova-qa/motion_continuity.json',JSON.stringify({maxJump,visibleComparisons,samples,jumps},null,2));
            if(maxJump>80) throw new Error('V3 Design motion discontinuity '+JSON.stringify({maxJump,visibleComparisons,jumps}));
            await context.close();
          }

          async function designDetailSequenceAudit(){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const {page}=await readyPage(context,'v3-detail-sequence');
            const checks=[
              {progress:.16,detail:'cushion',hotspot:'cushion',file:'design_detail_cushion.png'},
              {progress:.205,detail:'hinge',hotspot:'headband',file:'design_detail_hinge.png'},
              {progress:.255,detail:'controls',hotspot:'controls',file:'design_detail_controls.png'}
            ];
            for(const check of checks){
              await scrollProgress(page,check.progress);
              await page.waitForFunction(detail=>document.body.dataset.designDetail===detail,check.detail);
              await page.waitForFunction(hotspot=>{
                const el=document.querySelector('[data-hotspot="'+hotspot+'"]');
                return el && Number(getComputedStyle(el).opacity)>=.8;
              },check.hotspot);
              const state=await page.evaluate(({detail,hotspot})=>{
                const active=document.querySelector('[data-detail-id="'+detail+'"]');
                const activeHotspot=document.querySelector('[data-hotspot="'+hotspot+'"]');
                const inactive=[...document.querySelectorAll('.hotspot-layer .hotspot')].filter(el=>el!==activeHotspot);
                return {
                  detail:document.body.dataset.designDetail,
                  pressed:active?.getAttribute('aria-pressed'),
                  activeOpacity:Number(getComputedStyle(activeHotspot).opacity),
                  inactiveOpacity:Math.max(...inactive.map(el=>Number(getComputedStyle(el).opacity)))
                };
              },check);
              if(state.detail!==check.detail||state.pressed!=='true'||state.activeOpacity<.8||state.inactiveOpacity>.35){
                throw new Error('V3 Design detail sequence failed '+JSON.stringify({check,state}));
              }
              await page.screenshot({path:'nova-qa/'+check.file});
            }
            await context.close();
          }

          async function readabilityAudit(viewport,prefix){
            const context=await browser.newContext({viewport,hasTouch:prefix==='mobile',isMobile:prefix==='mobile'});
            const {page}=await readyPage(context,prefix+'-readability');
            await scrollProgress(page,.18);
            const metrics=await page.evaluate(()=>{
              const pick=selector=>{
                const el=document.querySelector(selector);
                const style=el?getComputedStyle(el):null;
                return {selector,fontSize:style?parseFloat(style.fontSize):0,color:style?.color||'',lineHeight:style?.lineHeight||''};
              };
              return {
                body:pick('.stage--design .copy>p:not(.eyebrow)'),
                utility:pick('.stage--design .eyebrow'),
                button:pick('.button'),
                nav:pick('.masthead')
              };
            });
            const minBody=prefix==='mobile'?16:16;
            if(metrics.body.fontSize<minBody) throw new Error(prefix+' readability body copy too small '+JSON.stringify(metrics));
            if(metrics.utility.fontSize<11||metrics.button.fontSize<12||metrics.nav.fontSize<12){
              throw new Error(prefix+' readability utility copy too small '+JSON.stringify(metrics));
            }
            await page.screenshot({path:'nova-qa/'+prefix+'_readability.png'});
            await context.close();
          }

          async function versionArchiveAudit(viewport,prefix){
            const context=await browser.newContext({viewport,hasTouch:prefix==='mobile',isMobile:prefix==='mobile'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/v1/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.dataset.modelState==='ready',{timeout:20000});
            const result=await page.evaluate(()=>({
              title:document.title,
              hero:document.body.innerText.includes('Scroll-controlled product film'),
              nova:document.body.innerText.includes('NOVA'),
              model:document.body.dataset.modelState
            }));
            if(result.model!=='ready'||!result.hero||!result.nova||errors.length){
              throw new Error(prefix+' V1 archive failed '+JSON.stringify({result,errors}));
            }
            await page.screenshot({path:'nova-qa/v1_'+prefix+'.png'});
            await context.close();
          }

          async function rendererFailureAudit(){
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/?static=1',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.dataset.modelState==='fallback' && document.body.dataset.uiReady==='true');
            const focus=page.locator('[data-listening-mode="focus"]');
            await focus.click();
            const facts=page.getByRole('button',{name:/specifications/i});
            await facts.click();
            await page.waitForFunction(()=>document.body.dataset.productFacts==='open');
            const result=await page.evaluate(()=>({
              state:document.body.dataset.modelState,
              runtime:document.querySelector('#runtimeState')?.textContent||'',
              posterOpacity:Number(getComputedStyle(document.querySelector('.product-poster')).opacity),
              focusPressed:document.querySelector('[data-listening-mode="focus"]')?.getAttribute('aria-pressed'),
              foldDisabled:Boolean(document.querySelector('[data-fold-state="fold"]')?.disabled),
              factsOpen:document.body.dataset.productFacts,
              headline:document.body.innerText.includes('Hear beyond')
            }));
            if(result.state!=='fallback'||!result.runtime.includes('STATIC MODE / 3D UNAVAILABLE')||result.posterOpacity<.9||result.focusPressed!=='true'||!result.foldDisabled||result.factsOpen!=='open'||!result.headline){
              throw new Error('renderer fallback incomplete '+JSON.stringify(result));
            }
            if(errors.length) throw new Error('renderer fallback pageerror '+errors.join(' | '));
            await page.screenshot({path:'nova-qa/static_fallback.png'});
            await context.close();
          }

          async function mobileNavAudit(){
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true});
            const {page}=await readyPage(context,'mobile-nav');
            await page.getByRole('button',{name:/menu/i}).tap();
            await page.waitForFunction(()=>document.body.dataset.mobileNav==='open');
            const state=await page.evaluate(()=>({
              open:document.body.dataset.mobileNav,
              hidden:document.querySelector('#mobileNavPanel')?.getAttribute('aria-hidden'),
              links:document.querySelectorAll('#mobileNavPanel a').length
            }));
            if(state.open!=='open'||state.hidden!=='false'||state.links<5) throw new Error('mobile navigation incomplete '+JSON.stringify(state));
            await page.screenshot({path:'nova-qa/mobile_nav.png'});
            await page.keyboard.press('Escape');
            await page.waitForFunction(()=>document.body.dataset.mobileNav==='closed');
            await context.close();
          }

          async function productFactsAudit(){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const {page}=await readyPage(context,'product-facts');
            await scrollProgress(page,.90);
            await page.getByRole('button',{name:/specifications/i}).click();
            await page.waitForFunction(()=>document.body.dataset.productFacts==='open');
            const state=await page.evaluate(()=>({
              open:document.body.dataset.productFacts,
              panelHidden:document.querySelector('#productFactsPanel')?.getAttribute('aria-hidden'),
              source:document.body.innerText.includes('Sony WH-1000XM6'),
              battery:document.body.innerText.includes('30 hrs')&&document.body.innerText.includes('40 hrs'),
              bluetooth:document.body.innerText.includes('Bluetooth 5.3'),
              codecs:document.body.innerText.includes('SBC / AAC / LDAC / LC3'),
              multipoint:document.body.innerText.includes('Multipoint'),
              sourceLink:document.querySelector('#productFactsPanel a[href*="sony.com/electronics/support"]')?.href||''
            }));
            if(state.open!=='open'||state.panelHidden!=='false'||!state.source||!state.battery||!state.bluetooth||!state.codecs||!state.multipoint||!state.sourceLink){
              throw new Error('reference specifications incomplete '+JSON.stringify(state));
            }
            await page.screenshot({path:'nova-qa/product_facts.png'});
            await page.locator('#productFactsPanel [data-facts-close]').click();
            await context.close();
          }

          async function inspectionViewsAudit(){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const {page}=await readyPage(context,'inspection-views');
            await scrollProgress(page,.79);
            await page.getByRole('button',{name:'Side',exact:true}).click();
            await page.waitForTimeout(520);
            if(await page.getByRole('button',{name:'Side',exact:true}).getAttribute('aria-pressed')!=='true') throw new Error('side inspection view did not activate');
            await page.getByRole('button',{name:'Rear',exact:true}).click();
            await page.waitForTimeout(680);
            if(await page.getByRole('button',{name:'Rear',exact:true}).getAttribute('aria-pressed')!=='true') throw new Error('rear inspection view did not activate');
            await page.screenshot({path:'nova-qa/inspection_rear.png'});
            await page.getByRole('button',{name:'Front',exact:true}).click();
            await page.waitForTimeout(520);
            await context.close();
          }

          async function reducedMotionAudit(){
            const context=await browser.newContext({viewport:{width:1024,height:768},reducedMotion:'reduce'});
            const {page}=await readyPage(context,'reduced-motion');
            await scrollProgress(page,.65);
            const state=await page.evaluate(()=>({
              range:document.body.dataset.range,
              settled:document.body.dataset.settled,
              controls:[...document.querySelectorAll('button')].filter(b=>!b.disabled).length
            }));
            if(state.settled!=='true') throw new Error('reduced motion should publish settled state');
            if(state.controls<3) throw new Error('reduced motion controls missing');
            await page.screenshot({path:'nova-qa/reduced_motion.png'});
            await context.close();
          }

          async function fallbackAudit(){
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            await page.route('**/headphones-web.gltf',route=>route.abort());
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.dataset.modelState==='error',{timeout:10000});
            const result=await page.evaluate(()=>({
              headline:document.body.innerText.includes('Hear beyond'),
              nav:Boolean(document.querySelector('.masthead')),
              productControl:Boolean(document.querySelector('[data-listening-mode="spatial"]'))
            }));
            if(!result.headline||!result.nav||!result.productControl) throw new Error('GLTF fallback hides product story '+JSON.stringify(result));
            if(pageErrors.length) throw new Error('fallback pageerror '+pageErrors.join(' | '));
            await page.screenshot({path:'nova-qa/model_fallback.png'});
            await context.close();
          }

          const phase=process.env.NOVA_QA_PHASE||'core';

          if(phase==='core'){
            await hotspotMotionAudit({width:1440,height:1000},'desktop');
            await hotspotMotionAudit({width:390,height:844},'mobile');
            await motionContinuityAudit();
            await designDetailSequenceAudit();
            await productPresenceAudit({width:1440,height:1000},'desktop');
            await productPresenceAudit({width:390,height:844},'mobile');
            await productCopyCollisionAudit({width:1440,height:1000},'desktop');
            await productCopyCollisionAudit({width:390,height:844},'mobile');

            const desktop=await captureJourney({width:1440,height:1000},'desktop');
            const tablet=await captureJourney({width:1024,height:768},'tablet');
            const mobile=await captureJourney({width:390,height:844},'mobile');
            fs.writeFileSync('nova-qa/core.json',JSON.stringify({phase,desktop,tablet,mobile,errors},null,2));
          }else if(phase==='extended'){
            await desktopInteractions();
            await mobileInteractions();
            await caseStudyAudit({width:1440,height:1000},'desktop');
            await caseStudyAudit({width:390,height:844},'mobile');
            await guidedTourAudit();
            await compactCaseStudyAudit();
            await validationEvidenceAudit();
            await readabilityAudit({width:1440,height:1000},'desktop');
            await readabilityAudit({width:390,height:844},'mobile');
            await rendererFailureAudit();
            await mobileNavAudit();
            await productFactsAudit();
            await inspectionViewsAudit();
            await versionArchiveAudit({width:1440,height:1000},'desktop');
            await versionArchiveAudit({width:390,height:844},'mobile');
            await reducedMotionAudit();
            await fallbackAudit();
            fs.writeFileSync('nova-qa/extended.json',JSON.stringify({phase,errors},null,2));
          }else{
            throw new Error('Unknown NOVA_QA_PHASE '+phase);
          }

          if(errors.length) throw new Error('Browser errors:\n'+errors.join('\n'));
          await browser.close();
          JS

      - name: Run V2 visual audit
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory nova/site >/tmp/nova-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          node nova/qa-v2.mjs
          cat "nova-qa/${NOVA_QA_PHASE}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-v2-visual-qa-${{ matrix.phase }}
          path: nova-qa
          retention-days: 7
