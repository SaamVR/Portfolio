name: NOVA Visual QA

on:
  push:
    branches: [main, "nova/v2-integration"]
    paths:
      - ".github/workflows/nova-qa.yml"
      - "nova/qa-trigger.txt"
      - "nova/site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact GLTF assets
        uses: actions/cache@v4
        with:
          path: nova/site/assets
          key: nova-gltf-assets-v1-b7ab75e30bb2b8a665b95e6b2105172892d7ec0c02c7e395fd8ce427add92ecc
          fail-on-cache-miss: true

      - name: Vendor Three.js GLTF runtime
        run: |
          set -euo pipefail
          mkdir -p nova/site/vendor/addons/loaders nova/site/vendor/addons/utils
          mkdir -p /tmp/nova-vendor && cd /tmp/nova-vendor
          npm init -y >/dev/null 2>&1
          npm install three@0.180.0 --no-audit --no-fund
          cp node_modules/three/build/three.module.js "$GITHUB_WORKSPACE/nova/site/vendor/"
          cp node_modules/three/build/three.core.js "$GITHUB_WORKSPACE/nova/site/vendor/"
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/loaders/"
          cp node_modules/three/examples/jsm/utils/BufferGeometryUtils.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/utils/"

      - name: Install browser QA
        run: |
          npm install playwright@1.57.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Create V2 QA script
        run: |
          cat > nova/qa-v2.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          fs.mkdirSync('nova-qa',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const errors=[];

          const progressPoints=[.02,.10,.119,.121,.20,.279,.281,.36,.449,.451,.57,.579,.581,.65,.719,.721,.79,.859,.861,.92,.959,.961,.985];

          async function readyPage(context,label){
            const page=await context.newPage();
            const local=[];
            page.on('pageerror',e=>{const v=label+': pageerror: '+e.message;errors.push(v);local.push(v);});
            page.on('console',m=>{if(m.type()==='error'){const v=label+': console: '+m.text();errors.push(v);local.push(v);}});
            page.on('requestfailed',r=>{const v=label+': requestfailed: '+r.url()+' :: '+(r.failure()?.errorText||'');errors.push(v);local.push(v);});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.dataset.modelState!=='loading',null,{timeout:20000});
            const model=await page.evaluate(()=>document.body.dataset.modelState);
            if(model!=='ready') throw new Error(label+' expected model ready, got '+model);
            return {page,local};
          }

          async function scrollProgress(page,p){
            await page.evaluate(progress=>{
              const max=document.documentElement.scrollHeight-innerHeight;
              scrollTo(0,Math.max(0,max*progress));
            },p);
            await page.waitForTimeout(520);
          }

          async function captureJourney(viewport,prefix){
            const context=await browser.newContext({viewport});
            const {page}=await readyPage(context,prefix);
            const captures=[];
            for(const p of progressPoints){
              await scrollProgress(page,p);
              const state=await page.evaluate(()=>{
                const range=document.body.dataset.range;
                const anchor=document.querySelector('[data-range-anchor="'+range+'"]');
                const content=anchor?.querySelector('.stage-inner,.behind-grid');
                const rect=content?.getBoundingClientRect();
                const style=content?getComputedStyle(content):null;
                return {
                  range,
                  rangeProgress:document.body.dataset.rangeProgress,
                  model:document.body.dataset.modelState,
                  settled:document.body.dataset.settled,
                  viewport:{width:innerWidth,height:innerHeight},
                  progress:scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight),
                  activeContentVisible:Boolean(rect && rect.bottom>0 && rect.top<innerHeight && Number(style.opacity)>.5)
                };
              });
              if(state.model!=='ready') throw new Error(prefix+' model not ready at '+p);
              if(!state.activeContentVisible) throw new Error(prefix+' active stage content missing at '+p+' '+JSON.stringify(state));
              const file=prefix+'_p'+String(p).replace('.','')+'.png';
              await page.screenshot({path:'nova-qa/'+file});
              captures.push({p,file,state});
            }
            await context.close();
            return captures;
          }

          async function desktopInteractions(){
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const {page}=await readyPage(context,'desktop-interactions');

            await scrollProgress(page,.36);
            await page.getByRole('button',{name:/focus/i}).click();
            await page.waitForTimeout(650);
            await page.screenshot({path:'nova-qa/desktop_focus.png'});

            await scrollProgress(page,.52);
            await page.getByRole('button',{name:/transparency/i}).click();
            await page.waitForTimeout(650);
            await page.screenshot({path:'nova-qa/desktop_transparency.png'});

            await scrollProgress(page,.65);
            await page.getByRole('button',{name:/fold/i}).click();
            await page.waitForTimeout(850);
            await page.screenshot({path:'nova-qa/desktop_fold.png'});
            await page.mouse.wheel(0,620);
            await page.waitForTimeout(420);
            await page.screenshot({path:'nova-qa/desktop_fold_release.png'});

            await scrollProgress(page,.79);
            const canvas=page.locator('#webgl');
            const box=await canvas.boundingBox();
            if(!box) throw new Error('inspection canvas missing');
            await page.mouse.move(box.x+box.width*.50,box.y+box.height*.50);
            await page.mouse.down();
            await page.mouse.move(box.x+box.width*.72,box.y+box.height*.52,{steps:8});
            await page.mouse.up();
            await page.waitForTimeout(450);
            await page.screenshot({path:'nova-qa/desktop_inspection_drag.png'});
            await page.getByRole('button',{name:/reset view/i}).click();
            await page.waitForTimeout(420);
            await page.screenshot({path:'nova-qa/desktop_inspection_reset.png'});

            await context.close();
          }

          async function mobileInteractions(){
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true});
            const {page}=await readyPage(context,'mobile-interactions');
            await scrollProgress(page,.36);
            await page.getByRole('button',{name:/ambient/i}).tap();
            await page.waitForTimeout(520);
            await page.screenshot({path:'nova-qa/mobile_ambient.png'});

            await scrollProgress(page,.79);
            const box=await page.locator('#webgl').boundingBox();
            if(!box) throw new Error('mobile inspection canvas missing');
            await page.evaluate(({x1,y1,x2,y2})=>{
              const el=document.querySelector('#webgl');
              el.dispatchEvent(new PointerEvent('pointerdown',{pointerId:7,pointerType:'touch',clientX:x1,clientY:y1,bubbles:true}));
              el.dispatchEvent(new PointerEvent('pointermove',{pointerId:7,pointerType:'touch',clientX:x2,clientY:y2,bubbles:true}));
              el.dispatchEvent(new PointerEvent('pointerup',{pointerId:7,pointerType:'touch',clientX:x2,clientY:y2,bubbles:true}));
            },{x1:box.x+box.width*.40,y1:box.y+box.height*.52,x2:box.x+box.width*.68,y2:box.y+box.height*.52});
            await page.waitForTimeout(450);
            await page.screenshot({path:'nova-qa/mobile_inspection_swipe.png'});
            await context.close();
          }

          async function reducedMotionAudit(){
            const context=await browser.newContext({viewport:{width:1024,height:768},reducedMotion:'reduce'});
            const {page}=await readyPage(context,'reduced-motion');
            await scrollProgress(page,.65);
            const state=await page.evaluate(()=>({
              range:document.body.dataset.range,
              settled:document.body.dataset.settled,
              controls:[...document.querySelectorAll('button')].filter(b=>!b.disabled).length
            }));
            if(state.settled!=='true') throw new Error('reduced motion should publish settled state');
            if(state.controls<3) throw new Error('reduced motion controls missing');
            await page.screenshot({path:'nova-qa/reduced_motion.png'});
            await context.close();
          }

          async function fallbackAudit(){
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            await page.route('**/headphones-web.gltf',route=>route.abort());
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.dataset.modelState==='error',{timeout:10000});
            const result=await page.evaluate(()=>({
              headline:document.body.innerText.includes('Hear beyond'),
              nav:Boolean(document.querySelector('.masthead')),
              productControl:Boolean(document.querySelector('[data-listening-mode="spatial"]'))
            }));
            if(!result.headline||!result.nav||!result.productControl) throw new Error('GLTF fallback hides product story '+JSON.stringify(result));
            if(pageErrors.length) throw new Error('fallback pageerror '+pageErrors.join(' | '));
            await page.screenshot({path:'nova-qa/model_fallback.png'});
            await context.close();
          }

          const desktop=await captureJourney({width:1440,height:1000},'desktop');
          const tablet=await captureJourney({width:1024,height:768},'tablet');
          const mobile=await captureJourney({width:390,height:844},'mobile');
          await desktopInteractions();
          await mobileInteractions();
          await reducedMotionAudit();
          await fallbackAudit();

          fs.writeFileSync('nova-qa/audit.json',JSON.stringify({desktop,tablet,mobile,errors},null,2));
          if(errors.length) throw new Error('Browser errors:\n'+errors.join('\n'));
          await browser.close();
          JS

      - name: Run V2 visual audit
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory nova/site >/tmp/nova-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          node nova/qa-v2.mjs
          cat nova-qa/audit.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-v2-visual-qa
          path: nova-qa
          retention-days: 7
