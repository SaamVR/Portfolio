name: NOVA Visual QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nova-qa.yml"
      - "nova/qa-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct GPT-runtime source
        run: |
          set -euo pipefail
          mkdir -p nova/site/assets nova/site/vendor/addons/{loaders,libs,curves,utils}
          failed=0
          for f in index.html styles.css app.js; do
            echo "=== $f ==="
            wc -c "nova/recovery/working-v1/${f}.gz.b64"
            sha256sum "nova/recovery/working-v1/${f}.gz.b64"
            base64 -d "nova/recovery/working-v1/${f}.gz.b64" > "/tmp/${f}.gz" || { echo "BASE64_FAIL $f"; failed=1; continue; }
            gzip -t "/tmp/${f}.gz" || { echo "GZIP_FAIL $f"; failed=1; continue; }
            gzip -dc "/tmp/${f}.gz" > "nova/site/${f}"
            wc -c "nova/site/${f}"
          done
          test "$failed" -eq 0

      - name: Vendor Three.js
        run: |
          set -euo pipefail
          mkdir -p /tmp/nova-vendor && cd /tmp/nova-vendor
          npm init -y >/dev/null 2>&1
          npm install three@0.180.0 --no-audit --no-fund
          cp node_modules/three/build/three.module.js "$GITHUB_WORKSPACE/nova/site/vendor/"
          cp node_modules/three/examples/jsm/loaders/FBXLoader.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/loaders/"
          cp node_modules/three/examples/jsm/libs/fflate.module.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/libs/"
          cp node_modules/three/examples/jsm/curves/NURBSCurve.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/curves/"
          cp node_modules/three/examples/jsm/curves/NURBSUtils.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/curves/"

      - name: Recover original FBX assets
        run: |
          set -euo pipefail
          ASSET_ZIP_URL='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-cfd0-8211-9349-f4beb8b02a9a/raw?se=2026-09-23T05%3A01%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=47bc988d-3131-5ea4-8e34-ccb2efda82e2&skoid=5e5afa93-cb2e-42ad-a58a-830b5b446f03&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T01%3A39%3A02Z&ske=2026-09-24T01%3A39%3A02Z&sks=b&skv=2026-02-06&sig=QwJhmISydgBE%2BO1M9iFiiCAVj9AWsJxlw3DGDMSTw7A%3D'
          curl -fsSL --retry 3 "$ASSET_ZIP_URL" -o /tmp/nova-qa-assets.zip
          echo "ASSET_ZIP_BYTES=$(stat -c%s /tmp/nova-qa-assets.zip)"
          test $(stat -c%s /tmp/nova-qa-assets.zip) -gt 6000000
          unzip -q /tmp/nova-qa-assets.zip -d nova/site/assets
          FBX="nova/site/assets/nova-headphones.fbx"
          echo "FBX_BYTES=$(stat -c%s "$FBX")"
          file "$FBX" || true
          head -c 24 "$FBX" | xxd
          test $(stat -c%s "$FBX") -gt 2000000
          head -c 18 "$FBX" | grep -a -q "Kaydara FBX Binary"

      - name: Install browser QA
        run: |
          npm install playwright@1.57.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Create QA script
        run: |
          cat > nova/qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('nova-qa',{recursive:true});
          const browser = await chromium.launch({headless:true});
          const errors=[];
          async function audit(viewport, prefix, scenes){
            const page=await browser.newPage({viewportSize:viewport});
            page.on('pageerror',e=>errors.push(prefix+': pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push(prefix+': console: '+m.text())});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.dataset.modelState!=='loading',{timeout:30000});
            const state=await page.evaluate(()=>({model:document.body.dataset.modelState,runtime:document.querySelector('#runtimeState')?.textContent}));
            if(state.model!=='ready') throw new Error(prefix+' model state '+JSON.stringify(state));
            for(const [scene,p] of scenes){
              await page.evaluate(([name,progress])=>{
                const s=document.querySelector('[data-scene="'+name+'"]');
                const vh=innerHeight; const y=s.offsetTop-vh*.72+progress*(s.offsetHeight-vh*.36);
                scrollTo(0,Math.max(0,y));
              },[scene,p]);
              await page.waitForTimeout(700);
              await page.screenshot({path:'nova-qa/'+prefix+'_'+scene+'_'+String(p).replace('.','')+'.png',fullPage:false});
            }
            const metrics=await page.evaluate(()=>({
              state:document.body.dataset.modelState,
              active:document.body.dataset.activeScene,
              bodyHeight:document.body.scrollHeight,
              runtime:document.querySelector('#runtimeState')?.textContent,
              sections:[...document.querySelectorAll('[data-scene]')].map(s=>({scene:s.dataset.scene,height:s.offsetHeight,top:s.offsetTop}))
            }));
            await page.close();
            return metrics;
          }
          const desktop=await audit({width:1440,height:1000},'desktop',[
            ['hero',.15],['form',.48],['mechanism',.25],['mechanism',.68],['choreography',.5],['interaction',.5],['closing',.45]
          ]);
          const mobile=await audit({width:390,height:844},'mobile',[
            ['hero',.12],['form',.5],['mechanism',.55],['choreography',.5],['interaction',.5],['closing',.4]
          ]);
          fs.writeFileSync('nova-qa/audit.json',JSON.stringify({desktop,mobile,errors},null,2));
          if(errors.length) throw new Error('Browser errors:\n'+errors.join('\n'));
          await browser.close();
          JS

      - name: Run visual audit
        run: |
          python3 -m http.server 4173 --directory nova/site >/tmp/nova-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          node nova/qa.mjs
          cat nova-qa/audit.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-visual-qa
          path: nova-qa
          retention-days: 7
