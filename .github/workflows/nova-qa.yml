name: NOVA Visual QA

on:
  push:
    branches: [main, "nova/v2-integration", "nova/v3"]
    paths:
      - ".github/workflows/nova-qa.yml"
      - "nova/qa-trigger.txt"
      - "nova/site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4