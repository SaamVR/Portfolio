name: Patch Final Preview Assertions

on:
  push:
    branches:
      - audit-fixes-2026-08-16
    paths:
      - ".github/workflows/patch-final-preview-assertions.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-16
      - name: Align final preview assertions with current UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/preview-smoke.spec.ts')
          text = path.read_text()

          old_login = '''  await page.getByTestId("admin-login-submit").click();\n  await expect(page.getByText(`Signed in as ${email}`)).toBeVisible({ timeout: 15000 });'''
          new_login = '''  await page.getByTestId("admin-login-submit").click();\n  await page.waitForURL((url) => url.pathname !== "/admin/login", { timeout: 15000 });'''
          if text.count(old_login) != 1:
              raise SystemExit(f'Expected one stale login assertion, found {text.count(old_login)}')
          text = text.replace(old_login, new_login, 1)

          old_mobile = '''    await page.goto(`/admin/page-builder/basic?storeId=${storeId}`);\n    await expect(page.getByText("Task 1 of")).toBeVisible({ timeout: 45000 });\n    await page.screenshot({ path: testInfo.outputPath("basic-editor-mobile.png"), fullPage: true });'''
          new_mobile = '''    await page.goto(`/admin/page-builder/basic?storeId=${storeId}`);\n    await expect(page.getByTestId("basic-mobile-preview-button")).toBeVisible({ timeout: 45000 });\n    await page.screenshot({ path: testInfo.outputPath("basic-editor-mobile.png"), fullPage: true });'''
          if text.count(old_mobile) != 1:
              raise SystemExit(f'Expected one stale mobile Basic assertion, found {text.count(old_mobile)}')
          text = text.replace(old_mobile, new_mobile, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- tests/preview-smoke.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/preview-smoke.spec.ts
          git commit -m "test: align final preview assertions with current UI"
          git push origin HEAD:audit-fixes-2026-08-16
