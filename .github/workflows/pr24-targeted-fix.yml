name: PR24 Targeted Fix

on:
  push:
    branches:
      - audit-fixes-2026-08-16

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-16
      - name: Apply narrow smoke-test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/preview-smoke.spec.ts")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '    await expect(page.getByRole("heading", { name: `Guided Editor: ${storeName}` })).toBeVisible({ timeout: 45000 });',
                  '    await expect(page.getByTestId("basic-mode-tab-pages").last()).toBeVisible({ timeout: 45000 });',
                  1,
              ),
              (
                  '      await expect(page.getByText(route.label).first()).toBeVisible({ timeout: 45000 });',
                  '      if (route.path.startsWith("/admin/returns")) {\n        await expect(page.getByRole("button", { name: "Create case" })).toBeVisible({ timeout: 45000 });\n      } else {\n        await expect(page.getByText(route.label).first()).toBeVisible({ timeout: 45000 });\n      }',
                  1,
              ),
              (
                  '    await expect(page.getByText("Expert Editing").first()).toBeVisible({ timeout: 45000 });',
                  '    await expect(page.getByTestId("open-template-publish-dialog")).toBeVisible({ timeout: 45000 });',
                  2,
              ),
          ]

          for old, new, expected_count in replacements:
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f"Expected {expected_count} match(es) for {old!r}, found {count}"
                  )
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary workflow and commit fixes
        shell: bash
        run: |
          rm .github/workflows/pr24-targeted-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/preview-smoke.spec.ts .github/workflows/pr24-targeted-fix.yml
          git commit -m "test: stabilize preview smoke readiness checks"
          git push origin HEAD:audit-fixes-2026-08-16
