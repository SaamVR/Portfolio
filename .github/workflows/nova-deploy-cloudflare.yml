name: NOVA Cloudflare Preview Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nova/deploy-trigger.txt"

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }

      - name: Restore exact GLTF assets
        uses: actions/cache@v4
        with:
          path: nova/site/assets
          key: nova-gltf-assets-v1-b7ab75e30bb2b8a665b95e6b2105172892d7ec0c02c7e395fd8ce427add92ecc
          fail-on-cache-miss: true

      - name: Vendor verified Three.js runtime
        run: |
          set -euo pipefail
          mkdir -p nova/site/vendor/addons/{loaders,utils}
          mkdir -p /tmp/nova-vendor && cd /tmp/nova-vendor
          npm init -y >/dev/null 2>&1
          npm install three@0.180.0 --no-audit --no-fund
          cp node_modules/three/build/three.module.js "$GITHUB_WORKSPACE/nova/site/vendor/"
          cp node_modules/three/build/three.core.js "$GITHUB_WORKSPACE/nova/site/vendor/"
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/loaders/"
          cp node_modules/three/examples/jsm/utils/BufferGeometryUtils.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/utils/"

      - name: Validate deploy payload
        run: |
          set -euo pipefail
          test -f nova/site/index.html
          test -f nova/site/app.js
          test -f nova/site/styles.css
          test -f nova/site/assets/headphones-web.gltf
          test -f nova/site/vendor/three.module.js
          grep -q "ArmatureAction" nova/site/assets/headphones-web.gltf
          echo "NOVA preview payload ready"

      - name: Deploy Cloudflare Pages preview
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy nova/site             --project-name nova-interactive-portfolio             --branch redesign             --commit-hash "$GITHUB_SHA"             --commit-message "NOVA verified GLTF editorial redesign"
