name: Publish NOVA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nova-pages-publish.yml"
      - "NovaAG/publish-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Portfolio main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout verified NOVA integration source
        uses: actions/checkout@v4
        with:
          ref: nova/v2-integration
          path: .nova-r13-source
          fetch-depth: 1

      - name: Restore exact GLTF assets
        uses: actions/cache@v4
        with:
          path: .nova-r13-source/nova/site/assets
          key: nova-gltf-assets-v1-b7ab75e30bb2b8a665b95e6b2105172892d7ec0c02c7e395fd8ce427add92ecc
          fail-on-cache-miss: true

      - name: Vendor Three.js 0.180 runtime
        run: |
          set -euo pipefail
          SITE="$GITHUB_WORKSPACE/.nova-r13-source/nova/site"
          mkdir -p "$SITE/vendor/addons/loaders" "$SITE/vendor/addons/utils"
          mkdir -p /tmp/nova-pages-vendor
          cd /tmp/nova-pages-vendor
          npm init -y >/dev/null 2>&1
          npm install three@0.180.0 --no-audit --no-fund
          cp node_modules/three/build/three.module.js "$SITE/vendor/"
          cp node_modules/three/build/three.core.js "$SITE/vendor/"
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js "$SITE/vendor/addons/loaders/"
          cp node_modules/three/examples/jsm/utils/BufferGeometryUtils.js "$SITE/vendor/addons/utils/"

      - name: Validate exact NOVA payload
        run: |
          set -euo pipefail
          SITE=".nova-r13-source/nova/site"
          test -f "$SITE/index.html"
          test -f "$SITE/styles.css"
          test -f "$SITE/app.js"
          test -f "$SITE/runtime/timeline.js"
          test -f "$SITE/runtime/composer.js"
          test -f "$SITE/runtime/render-adapter.js"
          test -f "$SITE/runtime/environment.js"
          test -f "$SITE/ui/product-ui.js"
          test -f "$SITE/ui/ui-bootstrap.js"
          test -f "$SITE/interactions/fold-controller.js"
          test -f "$SITE/interactions/inspection-controller.js"
          test -f "$SITE/interactions/hotspot-controller.js"
          test -f "$SITE/interactions/mode-controller.js"
          test -f "$SITE/assets/headphones-web.gltf"
          test -f "$SITE/vendor/three.module.js"
          test -f "$SITE/vendor/three.core.js"
          test -f "$SITE/vendor/addons/loaders/GLTFLoader.js"
          test -f "$SITE/vendor/addons/utils/BufferGeometryUtils.js"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path(".nova-r13-source/nova/site")
          g=json.loads((root/"assets/headphones-web.gltf").read_text())
          assert len(g["meshes"]) == 14
          assert len(g["skins"][0]["joints"]) == 36
          assert len(g["animations"]) == 3
          assert all((root/"assets"/img["uri"]).exists() for img in g["images"])
          print("NOVA GitHub Pages payload verified")
          PY

      - name: Publish under NovaAG
        run: |
          set -euo pipefail
          rm -rf NovaAG
          mkdir -p NovaAG
          cp -a .nova-r13-source/nova/site/. NovaAG/
          rm -rf .nova-r13-source
          touch .nojekyll

          test -f NovaAG/index.html
          test -f NovaAG/assets/headphones-web.gltf
          test -f NovaAG/vendor/three.module.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A NovaAG .nojekyll
          if git diff --cached --quiet; then
            echo "NovaAG already matches verified NOVA payload."
            exit 0
          fi
          git commit -m "publish(nova): GitHub Pages NovaAG"
          git push origin HEAD:main
