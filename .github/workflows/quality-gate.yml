name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-gate:
    name: Typecheck, test, lint, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-failure
          if-no-files-found: ignore
          path: |
            .next/trace
            .next/cache
            test-results
            playwright-report
            npm-debug.log*
