name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-gate:
    name: Typecheck, test, lint, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Production build
        id: build
        continue-on-error: true
        env:
          # Build-only placeholders. Runtime deployments provide the real values.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build

      - name: Dependency audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Upload failure artifacts
        if: >-
          always() &&
          (steps.typecheck.outcome != 'success' ||
           steps.tests.outcome != 'success' ||
           steps.lint.outcome != 'success' ||
           steps.build.outcome != 'success' ||
           steps.audit.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-failure
          if-no-files-found: ignore
          path: |
            .next/trace
            .next/cache
            test-results
            playwright-report
            npm-debug.log*

      - name: Enforce quality gate
        if: always()
        shell: bash
        run: |
          failed=0
          for outcome in \
            "${{ steps.typecheck.outcome }}" \
            "${{ steps.tests.outcome }}" \
            "${{ steps.lint.outcome }}" \
            "${{ steps.build.outcome }}" \
            "${{ steps.audit.outcome }}"; do
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
