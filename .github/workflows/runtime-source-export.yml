name: Runtime source export

on:
  push:
    branches:
      - runtime/leadflow-dashboard-redesign

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-runtime-source
          path: .
          include-hidden-files: true
          retention-days: 1
