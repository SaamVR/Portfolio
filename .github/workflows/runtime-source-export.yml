name: Apply GPT runtime LeadFlow redesign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: runtime/leadflow-dashboard-redesign
          fetch-depth: 0

      - name: Reconstruct and verify reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat             runtime/sync/chunk-000             runtime/sync/chunk-001             runtime/sync/chunk-002             runtime/sync/chunk-003-part-0             runtime/sync/chunk-003-part-1             runtime/sync/chunk-003-part-2             runtime/sync/chunk-003-part-3             runtime/sync/chunk-004             runtime/sync/chunk-005             runtime/sync/chunk-006             runtime/sync/chunk-007             > /tmp/leadflow-shippable.b64
          base64 -d /tmp/leadflow-shippable.b64 > /tmp/leadflow-shippable.tar.xz
          test "$(wc -c < /tmp/leadflow-shippable.tar.xz)" = "45000"
          echo "e7f465d32e83fd7dfd499c9eb4c2904855bbfe357edbce4192187ad1ed9f8b7d  /tmp/leadflow-shippable.tar.xz" | sha256sum -c -
          xz -t /tmp/leadflow-shippable.tar.xz

      - name: Apply reviewed files to main and verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "f0d1a5339fe493bb82511e54ce251cc9d1d20828"
          git checkout -B main origin/main
          tar -xJf /tmp/leadflow-shippable.tar.xz

          test -f dashboard.js
          test -f tests/browser_harness.py
          test -f tests/leadflow_final_runtime_audit.py

          node --test tests/leadflow-dashboard-model.test.js tests/leadflow-dashboard-dom.test.js
          node --check dashboard.js
          node --check app.js
          node --check functions/api/qualify.js
          git diff --check
          git diff --quiet -- v1 functions/v1 functions/api/qualify.js

          grep -q 'id="opsDistribution"' index.html
          grep -q 'id="opsScoreTrend"' index.html
          grep -q 'id="opsActionQueue"' index.html
          grep -q 'id="opsSourceQuality"' index.html
          grep -q 'id="opsUrgencyMix"' index.html
          grep -q 'src="./dashboard.js"' index.html

          git config user.name "SaamVR"
          git config user.email "163770486+SaamVR@users.noreply.github.com"
          git add index.html app.js dashboard.js styles.css             tests/browser_harness.py             tests/leadflow-dashboard-model.test.js             tests/leadflow-dashboard-dom.test.js             tests/leadflow_visual_audit.py             tests/leadflow_empty_state_audit.py             tests/leadflow_responsive_audit.py             tests/leadflow_source_truth_audit.py             tests/leadflow_final_runtime_audit.py

          git commit -m "refine LeadFlow dashboard readability and analytics"
          git push origin main
