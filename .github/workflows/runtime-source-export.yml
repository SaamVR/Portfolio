name: Apply GPT runtime LeadFlow redesign

on:
  push:
    branches:
      - runtime/leadflow-dashboard-redesign

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: runtime/leadflow-dashboard-redesign
          fetch-depth: 0

      - name: Reconstruct reviewed runtime payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .runtime/chunk-00 \
            .runtime/chunk-01 \
            .runtime/chunk-02 \
            .runtime/chunk-03-04 \
            .runtime/chunk-05-06 \
            .runtime/chunk-07-08 \
            | base64 -d > /tmp/leadflow-shipping.tar.xz
          test "$(stat -c%s /tmp/leadflow-shipping.tar.xz)" = "45004"
          echo "48169c8b65695abf40f866c889e871d19d8399e26eb8502c24872c606b5dd1e8  /tmp/leadflow-shipping.tar.xz" | sha256sum -c -
          xz -t /tmp/leadflow-shipping.tar.xz

      - name: Apply reviewed files to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          tar -xJf /tmp/leadflow-shipping.tar.xz

          test -f dashboard.js
          test -f tests/browser_harness.py
          test -f tests/leadflow_final_runtime_audit.py

          node --test
          node --check dashboard.js
          node --check app.js
          node --check functions/api/qualify.js
          git diff --check
          git diff --quiet -- v1 functions/v1 functions/api/qualify.js

          git config user.name "SaamVR"
          git config user.email "163770486+SaamVR@users.noreply.github.com"
          git add \
            index.html \
            app.js \
            dashboard.js \
            styles.css \
            tests/leadflow-dashboard-model.test.js \
            tests/leadflow-dashboard-dom.test.js \
            tests/browser_harness.py \
            tests/leadflow_visual_audit.py \
            tests/leadflow_empty_state_audit.py \
            tests/leadflow_responsive_audit.py \
            tests/leadflow_source_truth_audit.py \
            tests/leadflow_final_runtime_audit.py

          git commit -m "refine LeadFlow dashboard readability and analytics"
          git push origin main
