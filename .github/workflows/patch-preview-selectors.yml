name: Patch Preview Selectors

on:
  push:
    branches:
      - audit-fixes-2026-08-16
    paths:
      - ".github/workflows/patch-preview-selectors.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-16
      - name: Patch stale preview selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/preview-smoke.spec.ts')
          text = path.read_text()

          old_basic = '''    await page.getByTestId("basic-mode-tab-pages").last().click();\n    await expect(page.getByTestId("basic-flow-settings-panel")).toBeVisible({ timeout: 10000 });'''
          new_basic = '''    await page.getByTestId("basic-mode-tab-flow").last().click();\n    await expect(page.getByTestId("basic-flow-settings-panel")).toBeVisible({ timeout: 10000 });'''
          if text.count(old_basic) != 1:
              raise SystemExit(f'Expected exactly one stale Basic selector block, found {text.count(old_basic)}')
          text = text.replace(old_basic, new_basic, 1)

          old_advanced = '''    await page.goto(`/admin/page-builder/advanced?storeId=${storeId}`);\n    await expect(page.getByTestId("open-template-publish-dialog")).toBeVisible({ timeout: 45000 });'''
          new_advanced = '''    await page.goto(`/admin/page-builder/advanced?storeId=${storeId}&legacy=1`);\n    await expect(page.getByTestId("open-template-publish-dialog")).toBeVisible({ timeout: 45000 });'''
          if text.count(old_advanced) != 2:
              raise SystemExit(f'Expected exactly two stale Advanced publish blocks, found {text.count(old_advanced)}')
          text = text.replace(old_advanced, new_advanced)

          path.write_text(text)
          PY

          git diff --check
          git diff -- tests/preview-smoke.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/preview-smoke.spec.ts
          git commit -m "test: align preview smoke with current editor routes"
          git push origin HEAD:audit-fixes-2026-08-16
