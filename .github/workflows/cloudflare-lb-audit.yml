name: Cloudflare LB Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-lb-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_NAME: ezcomo.shop
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Test origin Host routing
        shell: bash
        run: |
          set -euo pipefail
          probe_host='probe.ezcomo.shop'

          echo '=== Render direct health ==='
          curl -sS -D /tmp/render-direct.headers -o /tmp/render-direct.body https://ecomcms-xjw4.onrender.com/api/health || true
          head -n 1 /tmp/render-direct.headers || true
          cat /tmp/render-direct.body || true
          echo

          echo '=== Render with tenant Host header ==='
          curl -sS -D /tmp/render-host.headers -o /tmp/render-host.body -H "Host: ${probe_host}" https://ecomcms-xjw4.onrender.com/api/health || true
          head -n 1 /tmp/render-host.headers || true
          cat /tmp/render-host.body || true
          echo

          echo '=== Vercel origin with tenant Host header ==='
          curl -sS -D /tmp/vercel-host.headers -o /tmp/vercel-host.body -H "Host: ${probe_host}" https://origin.ezcomo.shop/api/health || true
          head -n 1 /tmp/vercel-host.headers || true
          cat /tmp/vercel-host.body || true
          echo

      - name: Audit Cloudflare configuration
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')

          request() {
            local url="$1"
            local raw body code
            raw="$(curl -sS "${auth[@]}" -w $'\n%{http_code}' "$url")"
            code="${raw##*$'\n'}"
            body="${raw%$'\n'*}"
            printf '%s\n%s' "$code" "$body"
          }

          echo '=== Account token verification ==='
          raw="$(request "$api/accounts/$CF_ACCOUNT_ID/tokens/verify")"
          code="${raw%%$'\n'*}"; body="${raw#*$'\n'}"
          echo "HTTP $code"
          echo "$body" | jq '{success, status: .result.status, errors}'
          test "$code" = "200" || exit 1

          echo '=== Resolve zone ==='
          raw="$(request "$api/zones?name=${CF_ZONE_NAME}")"
          code="${raw%%$'\n'*}"; body="${raw#*$'\n'}"
          echo "HTTP $code"
          echo "$body" | jq '{success, matches: [.result[]? | {id,name,status,account:{id:.account.id,name:.account.name}}], errors}'
          ZONE_ID="$(echo "$body" | jq -r '.result[0].id // empty')"
          test -n "$ZONE_ID" || { echo "Could not resolve zone ${CF_ZONE_NAME}"; exit 1; }
          echo "Resolved zone ID: $ZONE_ID"

          echo '=== Transform Rule access ==='
          raw="$(request "$api/zones/$ZONE_ID/rulesets/phases/http_request_late_transform/entrypoint")"
          code="${raw%%$'\n'*}"; body="${raw#*$'\n'}"
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "$body" | jq '{success, ruleset: {id: .result.id, name: .result.name, phase: .result.phase, rule_count: (.result.rules | length)}, errors}'
          elif [ "$code" = "404" ]; then
            echo '{"success":true,"ruleset":null,"note":"No late-transform ruleset exists yet"}'
          else
            echo "$body" | jq '{success, errors}'
          fi

          echo '=== DNS permission / relevant records ==='
          raw="$(request "$api/zones/$ZONE_ID/dns_records?per_page=100")"
          code="${raw%%$'\n'*}"; body="${raw#*$'\n'}"
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "$body" | jq '{success, records: [.result[] | select(.name=="ezcomo.shop" or .name=="www.ezcomo.shop" or .name=="origin.ezcomo.shop" or .name=="customers.ezcomo.shop" or .name=="*.ezcomo.shop") | {id,type,name,content,proxied,ttl}], errors}'
          else
            echo "$body" | jq '{success, errors}'
          fi

          echo '=== Zone Load Balancer permission / existing LBs ==='
          raw="$(request "$api/zones/$ZONE_ID/load_balancers")"
          code="${raw%%$'\n'*}"; body="${raw#*$'\n'}"
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "$body" | jq '{success, load_balancers: [.result[] | {id,name,enabled,proxied,steering_policy,default_pools,fallback_pool,session_affinity,ttl}], errors}'
          else
            echo "$body" | jq '{success, errors}'
          fi

          echo '=== Account Pool permission / existing pools ==='
          raw="$(request "$api/accounts/$CF_ACCOUNT_ID/load_balancers/pools")"
          code="${raw%%$'\n'*}"; body="${raw#*$'\n'}"
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "$body" | jq '{success, pools: [.result[] | {id,name,enabled,minimum_origins,monitor,origins:[.origins[] | {name,address,enabled,weight,header}]}], errors}'
          else
            echo "$body" | jq '{success, errors}'
          fi

          echo '=== Account Monitor permission / existing monitors ==='
          raw="$(request "$api/accounts/$CF_ACCOUNT_ID/load_balancers/monitors")"
          code="${raw%%$'\n'*}"; body="${raw#*$'\n'}"
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "$body" | jq '{success, monitors: [.result[] | {id,type,description,method,path,port,timeout,retries,interval,expected_codes,follow_redirects,allow_insecure}], errors}'
          else
            echo "$body" | jq '{success, errors}'
          fi
