name: Cloudflare LB Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-lb-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_NAME: ezcomo.shop
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Audit Cloudflare configuration
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')

          cf_get() {
            local url="$1"
            curl --fail-with-body -sS "${auth[@]}" "$url"
          }

          echo '=== Account token verification ==='
          verify="$(cf_get "$api/accounts/$CF_ACCOUNT_ID/tokens/verify")"
          echo "$verify" | jq '{success, status: .result.status, errors}'

          echo '=== Resolve zone ==='
          zones="$(cf_get "$api/zones?name=${CF_ZONE_NAME}")"
          echo "$zones" | jq '{success, matches: [.result[] | {id,name,status,account:{id:.account.id,name:.account.name}}], errors}'
          ZONE_ID="$(echo "$zones" | jq -r '.result[0].id // empty')"
          test -n "$ZONE_ID" || { echo "Could not resolve zone ${CF_ZONE_NAME}"; exit 1; }
          echo "Resolved zone ID: $ZONE_ID"

          echo '=== Relevant DNS records ==='
          dns="$(cf_get "$api/zones/$ZONE_ID/dns_records?per_page=100")"
          echo "$dns" | jq '{success, records: [.result[] | select(.name=="ezcomo.shop" or .name=="www.ezcomo.shop" or .name=="origin.ezcomo.shop" or .name=="customers.ezcomo.shop" or .name=="*.ezcomo.shop") | {id,type,name,content,proxied,ttl}], errors}'

          echo '=== Existing zone load balancers ==='
          lbs="$(cf_get "$api/zones/$ZONE_ID/load_balancers")"
          echo "$lbs" | jq '{success, load_balancers: [.result[] | {id,name,enabled,proxied,steering_policy,default_pools,fallback_pool,session_affinity,ttl}], errors}'

          echo '=== Existing account pools ==='
          pools="$(cf_get "$api/accounts/$CF_ACCOUNT_ID/load_balancers/pools")"
          echo "$pools" | jq '{success, pools: [.result[] | {id,name,enabled,minimum_origins,monitor,origins:[.origins[] | {name,address,enabled,weight,header}]}], errors}'

          echo '=== Existing account monitors ==='
          monitors="$(cf_get "$api/accounts/$CF_ACCOUNT_ID/load_balancers/monitors")"
          echo "$monitors" | jq '{success, monitors: [.result[] | {id,type,description,method,path,port,timeout,retries,interval,expected_codes,follow_redirects,allow_insecure}], errors}'
