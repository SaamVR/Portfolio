name: Patch Stale Control Plane Columns

on:
  push:
    branches:
      - audit-fixes-2026-08-16
    paths:
      - ".github/workflows/patch-dialog-audit-stale-columns.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-16
      - name: Remove retired control-plane columns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/views/admin/PlatformControlPlane.tsx')
          text = path.read_text()
          replacements = {
            'products: Array<{ id: string; store_id: string; images?: any; thumbnail?: string | null; variants?: any; description?: string | null }>;':
              'products: Array<{ id: string; store_id: string; images?: any; variants?: any; description?: string | null }>;',
            'blocks: Array<{ id: string; store_id: string; page_id: string; is_visible: boolean | null; content?: any }>;':
              'blocks: Array<{ id: string; store_id: string; page_id: string; is_visible: boolean | null }>;',
            '.from("products").select("id, store_id, images, thumbnail, variants, description")':
              '.from("products").select("id, store_id, images, variants, description")',
            '.from("store_page_blocks").select("id, store_id, page_id, is_visible, content")':
              '.from("store_page_blocks").select("id, store_id, page_id, is_visible")',
            'products: (products ?? []) as Array<{ id: string; store_id: string; images?: any; thumbnail?: string | null; variants?: any; description?: string | null }>,':
              'products: (products ?? []) as Array<{ id: string; store_id: string; images?: any; variants?: any; description?: string | null }>,',
            'blocks: (blocks ?? []) as Array<{ id: string; store_id: string; page_id: string; is_visible: boolean | null; content?: any }>,':
              'blocks: (blocks ?? []) as Array<{ id: string; store_id: string; page_id: string; is_visible: boolean | null }>,',
          }
          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff --check
          git diff -- src/views/admin/PlatformControlPlane.tsx
          if grep -n 'images, thumbnail, variants' src/views/admin/PlatformControlPlane.tsx; then
            echo 'stale product thumbnail select remains' >&2
            exit 1
          fi
          if grep -n 'page_id, is_visible, content' src/views/admin/PlatformControlPlane.tsx; then
            echo 'stale block content select remains' >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/admin/PlatformControlPlane.tsx
          git commit -m "fix: stop querying retired control-plane columns"
          git push origin HEAD:audit-fixes-2026-08-16
