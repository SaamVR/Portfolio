name: Diagnose Merchant Signup

on:
  push:
    branches:
      - audit-fixes-2026-08-16
    paths:
      - ".github/workflows/diagnose-merchant-signup.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: >
          supabase start
          -x studio
          -x imgproxy
          -x postgres-meta
          -x logflare
          -x vector
          -x supavisor
          -x mailpit
      - name: Probe merchant-signup worker
        shell: bash
        run: |
          set +e
          eval "$(supabase status -o env)"
          echo "=== probe ==="
          status=$(curl -sS -o /tmp/merchant-signup-response.txt -w '%{http_code}' \
            -X POST http://127.0.0.1:54321/functions/v1/merchant-signup \
            -H "apikey: $ANON_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}')
          echo "HTTP $status"
          cat /tmp/merchant-signup-response.txt || true
          echo
          echo "=== containers ==="
          docker ps --format '{{.Names}}'
          echo "=== edge runtime logs ==="
          edge_container=$(docker ps --format '{{.Names}}' | grep -E 'edge[_-]runtime|edge-runtime' | head -n 1)
          if [ -n "$edge_container" ]; then
            docker logs "$edge_container" 2>&1 | tail -n 250
          fi
          test "$status" = "401"
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
