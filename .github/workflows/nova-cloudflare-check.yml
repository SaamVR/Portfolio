name: NOVA Cloudflare Capability Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nova-cloudflare-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN: missing"
            missing=1
          else
            echo "CLOUDFLARE_API_TOKEN: available"
          fi
          if [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID: missing"
            missing=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID: available"
          fi
          if [ "$missing" -ne 0 ]; then
            exit 2
          fi
          echo "Cloudflare deploy capability is available from GitHub Actions."
