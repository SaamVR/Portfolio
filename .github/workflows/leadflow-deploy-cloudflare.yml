name: LeadFlow Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "leadflow/deploy-trigger.txt"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify source
        run: |
          set -euo pipefail
          node --check app.js
          node --check dashboard.js
          node --check storytelling.js
          node --check functions/api/qualify.js
          node --check v3/app.js
          node --check functions/v3/api/qualify.js
          grep -q "LeadFlow — Lead Qualification" index.html
          grep -q "LEADFLOW V4 — WARM INDUSTRIAL PALETTE" styles.css
          grep -q "deterministic-qualification-v2" functions/api/qualify.js
          grep -q "/v3/api/qualify" v3/app.js
          grep -q "deterministic-qualification-v2" functions/v3/api/qualify.js
          grep -q "deterministic-qualification-v2" functions/v2/api/qualify.js
          grep -q "deterministic-qualification-v1" functions/v1/api/qualify.js

      - name: Require Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }

      - name: Build clean Pages payload
        run: |
          set -euo pipefail
          rm -rf /tmp/leadflow-deploy
          mkdir -p /tmp/leadflow-deploy
          cp index.html app.js dashboard.js storytelling.js styles.css favicon.svg /tmp/leadflow-deploy/
          cp -R v1 /tmp/leadflow-deploy/v1
          cp -R v2 /tmp/leadflow-deploy/v2
          cp -R v3 /tmp/leadflow-deploy/v3
          cp -R refine-brown /tmp/leadflow-deploy/refine-brown
          cp -R refine-navy /tmp/leadflow-deploy/refine-navy
          cp -R functions /tmp/leadflow-deploy/functions

      - name: Deploy Cloudflare Pages
        id: deploy
        run: |
          set -euo pipefail
          cd /tmp/leadflow-deploy
          npx wrangler@4 pages deploy . --project-name leadflow-ai --branch main --commit-hash "$GITHUB_SHA" --commit-message "LeadFlow V4 warm industrial + preserved v1/v2/v3" | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[^ ]+\.pages\.dev' /tmp/deploy.log | tail -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test V4 root and preserved versions
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          root=$(curl -fsSL "$url/")
          dashboard=$(curl -fsSL "$url/dashboard.js")
          storytelling=$(curl -fsSL "$url/storytelling.js")
          v3=$(curl -fsSL "$url/v3/")
          v2=$(curl -fsSL "$url/v2/")
          v1=$(curl -fsSL "$url/v1/")
          brown=$(curl -fsSL "$url/refine-brown/")
          navy=$(curl -fsSL "$url/refine-navy/")
          brown_css=$(curl -fsSL "$url/refine-brown/theme.css")
          navy_css=$(curl -fsSL "$url/refine-navy/theme.css")
          api=$(curl -fsSL "$url/api/qualify")
          v3api=$(curl -fsSL "$url/v3/api/qualify")
          v2api=$(curl -fsSL "$url/v2/api/qualify")
          v1api=$(curl -fsSL "$url/v1/api/qualify")
          echo "$root" | grep -q "LeadFlow — Lead Qualification"
          echo "$dashboard" | grep -q "LeadFlowDashboard"
          echo "$storytelling" | grep -q "LeadFlowStorytelling"
          echo "$v3" | grep -q "LeadFlow — Lead Qualification"
          echo "$v2" | grep -q "LeadFlow — Lead Qualification"
          echo "$v1" | grep -q "LeadFlow AI"
          echo "$brown" | grep -q "leadflow-refine-brown"
          echo "$navy" | grep -q "leadflow-refine-navy"
          echo "$brown_css" | grep -q "LEADFLOW REFINE — BROWN"
          echo "$navy_css" | grep -q "LEADFLOW REFINE — NAVY"
          echo "$api" | grep -q "deterministic-qualification-v2"
          echo "$v3api" | grep -q "deterministic-qualification-v2"
          echo "$v2api" | grep -q "deterministic-qualification-v2"
          echo "$v1api" | grep -q "deterministic-qualification-v1"

      - name: Capture QA screenshots
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          mkdir -p /tmp/leadflow-qa
          google-chrome --headless --no-sandbox --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/leadflow-qa/v4-root-desktop.png "$url/"
          google-chrome --headless --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=/tmp/leadflow-qa/v4-root-mobile-390.png "$url/"
          google-chrome --headless --no-sandbox --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/leadflow-qa/v3-desktop.png "$url/v3/"
          google-chrome --headless --no-sandbox --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/leadflow-qa/refine-brown-desktop.png "$url/refine-brown/"
          google-chrome --headless --no-sandbox --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/leadflow-qa/refine-navy-desktop.png "$url/refine-navy/"

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: leadflow-cloudflare-qa
          path: /tmp/leadflow-qa
          if-no-files-found: error
