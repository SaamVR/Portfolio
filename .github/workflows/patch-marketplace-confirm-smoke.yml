name: Patch Marketplace Confirm Smoke

on:
  push:
    branches:
      - audit-fixes-2026-08-16
    paths:
      - ".github/workflows/patch-marketplace-confirm-smoke.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-16
      - name: Accept marketplace apply confirmations in preview smoke
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/preview-smoke.spec.ts')
          text = path.read_text()
          old = '''    await page.getByTestId(`template-card-${marketplaceTemplateId}`).hover();\n    await page.getByTestId(`template-apply-${marketplaceTemplateId}`).click();\n\n    await expect.poll(async () => {'''
          new = '''    await page.getByTestId(`template-card-${marketplaceTemplateId}`).hover();\n    page.on("dialog", async (dialog) => {\n      expect(dialog.type()).toBe("confirm");\n      await dialog.accept();\n    });\n    await page.getByTestId(`template-apply-${marketplaceTemplateId}`).click();\n\n    await expect.poll(async () => {'''
          if text.count(old) != 2:
              raise SystemExit(f'Expected two marketplace apply blocks, found {text.count(old)}')
          text = text.replace(old, new)

          path.write_text(text)
          PY

          git diff --check
          git diff -- tests/preview-smoke.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/preview-smoke.spec.ts
          git commit -m "test: accept marketplace template apply confirmations"
          git push origin HEAD:audit-fixes-2026-08-16
