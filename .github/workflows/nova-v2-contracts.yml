name: NOVA V2 Contracts

on:
  push:
    branches:
      - "nova/v2-*"
      - "nova/v3"
      - "nova/v3-*"
    paths:
      - ".github/workflows/nova-v2-contracts.yml"
      - "nova/site/**"
      - "nova/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Runtime contracts
        run: |
          if [ -f nova/tests/render_adapter_contract.mjs ]; then
            node nova/tests/render_adapter_contract.mjs
          fi
          node nova/tests/timeline_contract.mjs
          if [ -f nova/tests/interaction_contract.mjs ]; then
            node nova/tests/interaction_contract.mjs
          fi
          if [ -f nova/tests/motion_handoff_contract.mjs ]; then
            node nova/tests/motion_handoff_contract.mjs
          fi
          if [ -f nova/tests/motion_control_contract.mjs ]; then
            node nova/tests/motion_control_contract.mjs
          fi
          if [ -f nova/tests/motion_pose_contract.mjs ]; then
            node nova/tests/motion_pose_contract.mjs
          fi
      - name: Python contracts
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest nova/tests -q
