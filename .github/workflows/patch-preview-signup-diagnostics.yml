name: Patch Preview Signup Diagnostics

on:
  push:
    branches:
      - audit-fixes-2026-08-16
    paths:
      - ".github/workflows/patch-preview-signup-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-16

      - name: Patch signup smoke synchronization and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | python
          rm -f .github/workflows/patch-preview-signup-diagnostics.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/preview-smoke.spec.ts .github/workflows/patch-preview-signup-diagnostics.yml
          git commit -m "Stabilize signup preview smoke and expose function errors"
          git push origin HEAD:audit-fixes-2026-08-16
