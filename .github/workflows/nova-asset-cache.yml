name: NOVA GLTF Asset Cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nova-asset-cache.yml"
      - "nova/asset-cache-trigger.txt"
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore or prepare exact GLTF asset cache
        id: cache
        uses: actions/cache@v4
        with:
          path: nova/site/assets
          key: nova-gltf-assets-v1-b7ab75e30bb2b8a665b95e6b2105172892d7ec0c02c7e395fd8ce427add92ecc

      - name: Download exact GPT-runtime GLTF bundle
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ASSET_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-96e0-8211-ae7e-5a3d8f26dd7e/raw?se=2026-09-23T06%3A40%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=f8ed8d27-68bf-5e35-b336-b7c42b2c1954&skoid=5e5afa93-cb2e-42ad-a58a-830b5b446f03&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T01%3A12%3A16Z&ske=2026-09-24T01%3A12%3A16Z&sks=b&skv=2026-02-06&sig=V3/yV5nLkRaHRWYKPQ823oZWbZcnDqLoeYCuD4rjy3I%3D"
        run: |
          set -euo pipefail
          rm -rf nova/site/assets
          mkdir -p nova/site/assets
          curl -fsSL --retry 3 "$ASSET_URL" -o /tmp/nova-gltf-assets.zip
          test "$(stat -c%s /tmp/nova-gltf-assets.zip)" -eq 1382987
          echo "b7ab75e30bb2b8a665b95e6b2105172892d7ec0c02c7e395fd8ce427add92ecc  /tmp/nova-gltf-assets.zip" | sha256sum -c -
          unzip -q /tmp/nova-gltf-assets.zip -d nova/site/assets

      - name: Validate GLTF cache payload
        run: |
          set -euo pipefail
          test "$(find nova/site/assets -maxdepth 1 -type f | wc -l)" -eq 13
          test "$(stat -c%s nova/site/assets/headphones-web.gltf)" -eq 1862871
          grep -q '"ArmatureAction"' nova/site/assets/headphones-web.gltf
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("nova/site/assets")
          g=json.loads((root/"headphones-web.gltf").read_text())
          assert len(g["meshes"]) == 14
          assert len(g["skins"][0]["joints"]) == 36
          assert len(g["animations"]) == 3
          assert all((root / x["uri"]).exists() for x in g["images"])
          assert all(x["uri"].endswith(".webp") for x in g["images"])
          print("GLTF asset cache valid:", len(g["images"]), "textures")
          PY
          du -sh nova/site/assets
