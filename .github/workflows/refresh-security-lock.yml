name: Refresh Security Lockfile

on:
  push:
    branches:
      - audit-fixes-2026-08-16
    paths:
      - ".github/workflows/refresh-security-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-16

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply compatible audit fixes to lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for security advisories"
          git push origin HEAD:audit-fixes-2026-08-16
