name: NOVA V3 Detail QA

on:
  push:
    branches: ["nova/v3-real-product"]
    paths:
      - ".github/workflows/nova-hotspot-qa.yml"
      - "nova/site/app.js"
      - "nova/site/interactions/hotspot-controller.js"
      - "nova/site/runtime/timeline.js"
      - "nova/site/ui/product-ui.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotspot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact GLTF assets
        uses: actions/cache@v4
        with:
          path: nova/site/assets
          key: nova-gltf-assets-v1-b7ab75e30bb2b8a665b95e6b2105172892d7ec0c02c7e395fd8ce427add92ecc
          fail-on-cache-miss: true

      - name: Vendor Three.js GLTF runtime
        run: |
          set -euo pipefail
          mkdir -p nova/site/vendor/addons/loaders nova/site/vendor/addons/utils
          mkdir -p /tmp/nova-hotspot-vendor && cd /tmp/nova-hotspot-vendor
          npm init -y >/dev/null 2>&1
          npm install three@0.180.0 --no-audit --no-fund
          cp node_modules/three/build/three.module.js "$GITHUB_WORKSPACE/nova/site/vendor/"
          cp node_modules/three/build/three.core.js "$GITHUB_WORKSPACE/nova/site/vendor/"
          cp node_modules/three/examples/jsm/loaders/GLTFLoader.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/loaders/"
          cp node_modules/three/examples/jsm/utils/BufferGeometryUtils.js "$GITHUB_WORKSPACE/nova/site/vendor/addons/utils/"

      - name: Install Playwright
        run: |
          npm install playwright@1.57.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Create focused hotspot audit
        run: |
          cat > nova/hotspot-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('nova-hotspot-qa',{recursive:true});
          const browser=await chromium.launch({headless:true});

          async function audit(viewport,prefix){
            const context=await browser.newContext({viewport,hasTouch:prefix==='mobile',isMobile:prefix==='mobile'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text());});
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.body.dataset.modelState==='ready',{timeout:20000});

            const scrollProgress=async p=>{
              await page.evaluate(value=>{
                document.documentElement.style.scrollBehavior='auto';
                const behind=document.querySelector('#behind');
                const cinematicMax=Math.max(1,behind.offsetTop+behind.offsetHeight-innerHeight);
                scrollTo(0,cinematicMax*value);
              },p);
              await page.waitForFunction(value=>{
                const behind=document.querySelector('#behind');
                const cinematicMax=Math.max(1,behind.offsetTop+behind.offsetHeight-innerHeight);
                return Math.abs(scrollY/cinematicMax-value)<.003;
              },p,{timeout:3000});
              await page.waitForTimeout(360);
            };

            const details=[];
            for(const [p,id] of [[.15,'cushion'],[.20,'headband'],[.26,'controls']]){
              await scrollProgress(p);
              await page.waitForFunction(expected=>document.body.dataset.detailFocus===expected,id);
              const state=await page.evaluate(expected=>{
                const visible=[...document.querySelectorAll('[data-hotspot]')].filter(el=>el.dataset.visible==='true').map(el=>{
                  const r=el.getBoundingClientRect();
                  return {id:el.dataset.hotspot,x:r.left+r.width/2,y:r.top+r.height/2};
                });
                return {expected,visible,w:innerWidth,h:innerHeight};
              },id);
              if(state.visible.length!==1||state.visible[0].id!==id) throw new Error(prefix+' single detail focus failed '+JSON.stringify(state));
              const point=state.visible[0];
              if(point.x<12||point.x>state.w-12||point.y<12||point.y>state.h-12) throw new Error(prefix+' detail outside viewport '+JSON.stringify(state));
              details.push({p,id,point});
              await page.screenshot({path:'nova-hotspot-qa/'+prefix+'_'+id+'.png'});
            }

            const controls=[];
            for(const [p,id] of [[.47,'power'],[.515,'multifunction'],[.565,'volume']]){
              await scrollProgress(p);
              await page.waitForFunction(expected=>document.body.dataset.controlInput===expected,id);
              const state=await page.evaluate(()=>({
                active:document.body.dataset.controlInput,
                count:document.querySelectorAll('.control-input[data-control-input]').length,
                current:[...new Set([...document.querySelectorAll('.control-input[data-control-input]')].filter(el=>el.getAttribute('aria-current')==='true').map(el=>el.dataset.controlInput))],
                marker:document.querySelector('[data-hotspot="controls"]')?.dataset.visible
              }));
              if(state.active!==id||state.count!==3||state.current.length!==1||state.current[0]!==id||state.marker!=='true') throw new Error(prefix+' control input sequence failed '+JSON.stringify({id,state}));
              controls.push({p,id});
              await page.screenshot({path:'nova-hotspot-qa/'+prefix+'_control_'+id+'.png'});
            }

            if(errors.length) throw new Error(prefix+' browser errors '+errors.join(' | '));
            await context.close();
            return {details,controls};
          }

          const desktop=await audit({width:1440,height:1000},'desktop');
          const mobile=await audit({width:390,height:844},'mobile');
          fs.writeFileSync('nova-hotspot-qa/result.json',JSON.stringify({desktop,mobile},null,2));
          console.log(JSON.stringify({desktop,mobile},null,2));
          await browser.close();
          JS

      - name: Run focused audit
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory nova/site >/tmp/nova-hotspot-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          node nova/hotspot-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-hotspot-qa
          path: nova-hotspot-qa
          retention-days: 3

